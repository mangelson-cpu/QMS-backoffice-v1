version: '3.8'

services:
  frontend-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-attente/dashboard:latest
    container_name: file_attente_dashboard
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
